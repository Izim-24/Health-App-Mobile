# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the file location instead.

# For more details on how to configure your build environment visit
# http://www.gradle.org/configure-maven-gradle-and-ant-builds

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also http://www.gradle.org/java-toolchain
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/configure-maven-gradle-and-ant-builds
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and hence the library R class won't have all
# transitive resource IDs that are exported from all its dependencies.
android.nonTransitiveRClass=true

# API Keys - Override in local.properties
AI_VISION_API_KEY=CONFIGURE_IN_LOCAL_PROPERTIES
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# Keep the app (and its data) installed after connectedAndroidTest. By default AGP uninstalls the
# tested app when instrumented tests finish, which deletes the emulator's app data.
android.injected.androidTest.leaveApksInstalledAfterRun=true
