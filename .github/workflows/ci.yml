name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android — unit tests, lint, debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (domain, mappers, ViewModels)
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  backend:
    name: Backend — node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
